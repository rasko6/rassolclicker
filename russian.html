<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JS кликер</title>
</head>
<body>
<center>
    <h1 id="privet">
        кликай на эту штуку... сейчас же
    </h1>
    <h3>связь с автором: pingypongytt@gmail.com</h3>
    <img src="rasso.png" onclick="clicked()" id="imag">
    <hr>
    <h2 id="counting">
        счет: 0
    </h2>
    <hr>
    <h1>апгрейды</h1>
    <br>
    <div id="buttonscontainer">
    <button onclick="buy1()" id="buyup1button">
        +2 за 1(10)
    </button>
    <button onclick="buy2()" id="buyup2button">
        +10 за 1(50)
    </button>
    <button onclick="buy3()" id="buyup3button">
        +50 за 1(500)
    </button>
    </div>
    <br>
    <hr>
    <h1>мои другие вебсайты</h1>
    <hr>
    <div id="buttons container">
    <a href="https:/friendness.neocities.org">>friendness.neocities.org</a>
    <br>
    <a href="https:/friendness.neocities.org">>friendness.neocities.org</a>
    <br>
    <a href="https:/friendness.neocities.org">>friendness.neocities.org</a>
    </div>
    <br>
    <hr>
    <h1>язык</h1>
    <button onclick="location.href='index.html'">english</button>
    <br>
    <hr>
</center>
<script>
    let count1 = 0;
    let boughtup1 = false;
    let boughtup2 = false;
    let boughtup3 = false;
    function updatebuttons() {
    const up1button = document.getElementById("buyup1button");
    const up2button = document.getElementById("buyup2button");
    const up3button = document.getElementById("buyup3button");
    
    up1button.disabled = (count1 < 10 || boughtup1);
    up2button.disabled = (count1 < 50 || boughtup2);
    up3button.disabled = (count1 < 500 || boughtup3);
}
updatebuttons();
    function updatecount(){
        const abcd = document.getElementById("counting");
        abcd.textContent = ("счет: " + count1);
    }
    function clicked(){
        const img = document.getElementById("imag");
        img.src = "rassopress.png";
        setTimeout(() => {
        img.src = "rassolhover.png";
        }, 100);
        if (boughtup1 && boughtup2 && boughtup3) {
            count1 = count1 + 50;
        } else if (boughtup1 && boughtup2) {
            count1 = count1 + 10;
        } else if (boughtup1){
            count1 = count1 + 2;
        } else {
            count1 = count1 + 1;
        }
        updatebuttons();
        updatecount();
    }
    function buy1(){
        if (count1 >= 10){
        count1 = count1 - 10;
        boughtup1 = true;
        const up1button = document.getElementById("buyup1button");
        up1button.disabled = true;
        }
        updatebuttons();
        updatecount();
    }
    function buy2(){
        if (count1 >= 50){
        count1 = count1 - 50;
        boughtup2 = true;
        const up2button = document.getElementById("buyup2button");
        up2button.disabled = true;
        }
        updatebuttons();
        updatecount();
    }
    function buy3(){
        if (count1 >= 500){
        count1 = count1 - 500;
        boughtup3 = true;
        const up3button = document.getElementById("buyup3button");
        up3button.disabled = true;
        }
        updatebuttons();
        updatecount();
    }
    document.getElementById("imag").onmouseover = function() {
        this.src = "rassolhover.png";
    }
    document.getElementById("imag").onmouseleave = function() {
        this.src = "rasso.png";
    };
</script>
</body>
</html>
